name: Build RadarRC

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: RadarRC-linux-amd64
            asset_name: RadarRC-linux-amd64
          - os: macos-latest
            artifact_name: RadarRC-macos
            asset_name: RadarRC-macos
          - os: windows-latest
            artifact_name: RadarRC-windows-amd64
            asset_name: RadarRC-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller qasync websockets

      - name: Build with PyInstaller (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          python -m PyInstaller --noconfirm --windowed --name RadarRC --add-data "assets:assets" --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 run.py
          cd dist && zip -r ${{ matrix.artifact_name }}.zip RadarRC

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --windowed --name RadarRC --add-data "assets;assets" --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 run.py
          cd dist && Compress-Archive -Path RadarRC -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
